version: '3.8'

services:
  # PostgreSQL Database Container
  postgres:
    image: postgres:16-alpine
    container_name: aitrustscore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: aitrustscore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend API Container
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aitrustscore-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/aitrustscore"
      SECRET_KEY: "aitrustscore-docker-secret-key-production"
      DEMO_MODE: "True"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # Frontend Web Container
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aitrustscore-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
